[package]
name = "rdp-center"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "RDP Center — Native Windows 11 IT Asset & Remote Launcher (RDP, SSH, Web Admin)"

[[bin]]
name = "RDPCenter"
path = "src/main.rs"

[dependencies]
windows-reactor = "0.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipboard-win = "5"

[profile.release]
opt-level = "s"
lto = true
strip = true
